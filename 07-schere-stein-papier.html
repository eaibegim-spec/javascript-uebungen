<!DOCTYPE html>
<html>

<head>
  <title>Stein Papier Schere</title>
</head>

<body>
  <p>Schere Stein Papier</p>
  <button onclick="
        playGame('Papier');
  ">Stein</button>

  <button onclick="
    playGame('Papier');
  ">Papier</button>

  <button onclick="
      playGame('Schere');
      ">Schere</button>

  <script>

    function playGame(playerMove) {
      const computerMove = pickComputerMove();

      let result = '';

      if (playerMove === 'Schere') {
        if (computerMove === 'Stein') {
          result = 'Du hast verloren';
        } else if (computerMove === 'Papier') {
          result = 'Du hast gewonnen';
        }
        else if (computerMove === 'Schere') {
          result = 'Remis';
        }
      } else if (playerMove === 'Papier') {
         if (computerMove === 'Stein') {
              result = 'Du hast gewonnen';
            } else if (computerMove === 'Papier') { 
              result = 'Remis';
            }
            else if (computerMove === 'Schere' ) {
              result = 'Du hast verloren';
            }
      } else if (playerMove === 'Stein') {
        if (computerMove === 'Stein') {
              result = 'Du hast verloren';
            } else if (computerMove === 'Papier') { 
              result = 'Remis';
            }
            else if (computerMove === 'Schere' ) {
              result = 'Du hast gewonnen';
            }
      }


      alert(`Du hast ${playerMove}. Computer hat ${computerMove}. ${result}`);
    }

    function pickComputerMove() {
      const randomNumber = Math.random();
      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Stein';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Papier';
      } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'Schere';
      }

      return computerMove;
    }



  </script>
</body>

</html>
